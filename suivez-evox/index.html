<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivez EVOX Performance</title>
<link rel="stylesheet" href="https://use.typekit.net/yqa3sik.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #11110E;
    --vert: #CCFF00;
    --gris: #8A8A84;
    --filet: #E4E4DF;
    --fond: #FFFFFF;
    --ease: cubic-bezier(.22, .8, .24, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--fond); color: var(--noir); font-family: "Montserrat", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  .page { max-width: 1040px; margin: 0 auto; padding: clamp(40px, 7vw, 80px) clamp(16px, 5vw, 48px) clamp(36px, 6vw, 64px); }

  /* En-tête */
  .surtitre { font-family: "Poppins", sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--gris); display: flex; align-items: center; gap: 10px; }
  .surtitre::before { content: ""; width: 8px; height: 8px; background: var(--vert); }
  h1 {
    margin-top: 20px; font-family: "cofo-peshka-variable", "Poppins", sans-serif; text-transform: uppercase;
    font-variation-settings: "wght" 800, "wdth" 150; font-size: clamp(30px, 6.4vw, 68px); line-height: .98; letter-spacing: .01em;
  }
  h1 span { display: block; color: #6B6B66; font-variation-settings: "wght" 500, "wdth" 150; }
  .intro { margin-top: 20px; max-width: 460px; font-size: 15px; line-height: 1.65; color: #5C5C57; }

  /* Liste des réseaux */
  .reseaux { list-style: none; margin-top: clamp(36px, 6vw, 56px); border-top: 1px solid var(--noir); }
  .reseaux li { border-bottom: 1px solid var(--filet); opacity: 0; transform: translateY(12px); animation: entre .9s var(--ease) forwards; }
  .reseaux li:nth-child(2) { animation-delay: .08s; } .reseaux li:nth-child(3) { animation-delay: .16s; } .reseaux li:nth-child(4) { animation-delay: .24s; }
  .reseaux a {
    position: relative; display: grid; grid-template-columns: 56px 1fr auto 52px; align-items: center; gap: 16px;
    padding: clamp(18px, 2.6vw, 26px) 4px; overflow: hidden; isolation: isolate;
  }
  .reseaux a::before { /* fond noir qui glisse au survol */
    content: ""; position: absolute; inset: 0; background: var(--noir); z-index: -1;
    transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease);
  }
  .num { font-family: "Poppins", sans-serif; font-weight: 500; font-size: 12px; letter-spacing: .14em; color: var(--gris); padding-left: 8px; transition: color .4s; }
  .nom { font-family: "Poppins", sans-serif; font-weight: 600; font-size: clamp(24px, 3.6vw, 40px); letter-spacing: -.01em; line-height: 1; transition: color .4s, transform .6s var(--ease); }
  .compte { font-size: 13px; color: var(--gris); text-align: right; transition: color .4s; }
  .fleche {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--noir); display: grid; place-items: center; justify-self: end; margin-right: 8px;
    transition: background .4s, border-color .4s, color .4s, transform .6s var(--ease);
  }
  .fleche svg { transition: transform .5s var(--ease); }

  .reseaux a:hover::before, .reseaux a:focus-visible::before { transform: scaleX(1); }
  .reseaux a:hover .nom, .reseaux a:focus-visible .nom { color: #fff; transform: translateX(6px); }
  .reseaux a:hover .num, .reseaux a:hover .compte, .reseaux a:focus-visible .num, .reseaux a:focus-visible .compte { color: #BDBDB6; }
  .reseaux a:hover .fleche, .reseaux a:focus-visible .fleche { background: var(--vert); border-color: var(--vert); color: var(--noir); }
  .reseaux a:hover .fleche svg, .reseaux a:focus-visible .fleche svg { transform: rotate(45deg); }
  .reseaux a:focus-visible { outline: 2px solid var(--vert); outline-offset: -2px; }

  /* Pied */
  .pied { margin-top: clamp(32px, 5vw, 48px); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .pied img { height: 22px; display: block; }
  .pied span { font-family: "Poppins", sans-serif; font-weight: 500; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gris); }

  @keyframes entre { to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    .reseaux a { grid-template-columns: 34px 1fr 44px; gap: 10px 12px; }
    .num { padding-left: 0; }
    .compte { grid-column: 2; grid-row: 2; text-align: left; margin-top: -4px; }
    .fleche { grid-column: 3; grid-row: 1 / span 2; margin-right: 0; width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition-duration: .01ms !important; }
    .reseaux li { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main class="page">
  <p class="surtitre">Réseaux sociaux</p>

  <ul class="reseaux">

      <span class="fleche" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11 11 3M5 3h6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a></li>
    <li><a href="https://www.facebook.com/EVOXPERFORMANCEFRANCE/?locale=fr_FR" target="_blank" rel="noopener noreferrer">

      <span class="fleche" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11 11 3M5 3h6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

    <li><a href="https://www.tiktok.com/@evoxperformance" target="_blank" rel="noopener noreferrer">
      <span class="num">03</span><span class="nom">TikTok</span><span class="compte">@evoxperformance</span>

    <li><a href="https://www.youtube.com/@evoxperformance3388/videos" target="_blank" rel="noopener noreferrer">
      <span class="num">04</span><span class="nom">YouTube</span><span class="compte">EVOX Performance</span>
      <span class="fleche" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 11 11 3M5 3h6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

  <footer class="pied">
    <img src="evox-logo-noir.svg" alt="EVOX Performance">
    <span>Performance without compromise</span>
  </footer>
</main>
</body>
</html>
